name: orblit_physics_vehicle
description: >-
  A car for an Orblit physics world. A chassis on wheels that are casts, with
  springs, dampers, anti-roll bars, tyres, steering and brakes.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_physics:
    path: ../orblit_physics
  vector_math: ^2.1.4

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
