name: orblit_physics_terrain
description: >-
  An Orblit terrain as ground in a physics world. Lays a height field for each
  region near a point, and lays it again when the terrain under it changes.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_physics:
    path: ../orblit_physics
  # The terrain lives in the engine. tool/link_local.sh points this at a
  # sibling checkout instead, which is how CI builds it.
  orblit_terrain:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_terrain
      ref: main

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
