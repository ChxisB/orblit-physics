name: orblit_physics
description: >-
  Rigid body physics for Orblit. A sequential impulse solver in C++, driven
  from Dart by a queue of commands and read back a whole world at a time.
version: 0.4.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  code_assets: ^1.2.1
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
