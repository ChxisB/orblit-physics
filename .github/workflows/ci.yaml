name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-physics

      # The solver depends on nothing, but the scene bridge reads Orblit's
      # scene documents. CI checks the engine out beside this repository and
      # points the bridge at it, so a change here is tested against the engine
      # as it is now rather than whatever a lockfile last saw.
      - uses: actions/checkout@v4
        with:
          # No token: the engine is public, and the default GITHUB_TOKEN
          # reads it.
          repository: ChxisB/orblit
          path: orblit

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned: the formatter changes between releases, and tracking
          # stable turns an unrelated SDK bump into a red build.
          sdk: 3.13.0

      - name: Link the engine
        working-directory: orblit-physics
        run: ./tool/link_local.sh ../orblit

      - name: Check
        working-directory: orblit-physics
        run: ./tool/check.sh

  # The .NET port. The engine packages are packed from the engine checkout
  # beside this one, so a change here is tested against the engine as it is now.
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-physics

      - uses: actions/checkout@v4
        with:
          repository: ChxisB/orblit
          path: orblit

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: orblit-physics/dotnet/global.json

      # The runner context exists in a step and not in a job's env, so the
      # feed folder is named on each step that reads it.
      - name: Pack the engine
        shell: bash
        working-directory: orblit
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: tool/pack_local.sh

      - name: Check
        shell: bash
        working-directory: orblit-physics
        env:
          ORBLIT_FEED: ${{ runner.temp }}/feed
        run: tool/check_dotnet.sh

  # Checks each commit on a pull request against commitlint.config.mjs.
  # Pull requests only, since a push to main has no range to check. It
  # checks out the branch head, not the merge commit GitHub makes, so the
  # range holds the branch's own commits and nothing else.
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @commitlint/cli@21 --from "origin/$BASE_BRANCH" --to HEAD
        env:
          BASE_BRANCH: ${{ github.base_ref }}
