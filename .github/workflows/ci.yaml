name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned: the formatter changes between releases, and tracking
          # stable turns an unrelated SDK bump into a red build.
          sdk: 3.13.0
      - run: ./tool/check.sh
